name: Python CI
on:
  push:
  pull_request:
jobs:
  test:
    # Changed from ubuntu-latest to windows-latest
    runs-on: windows-latest 
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirement.txt

      - name: Run data validation
        run: python main.py --input .\data\raw\Telco-Customer-Churn.csv

      - name: Run tests
        run: python -m pytest Test/test.py
